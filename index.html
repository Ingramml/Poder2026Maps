<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ed Hermes Support - CD4 Precincts</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  #map { width: 100%; height: 100vh; }
  .legend {
    background: white; padding: 12px 16px; border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2); line-height: 1.8; font-family: system-ui;
  }
  .legend h4 { margin-bottom: 6px; font-size: 13px; }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .legend-color { width: 16px; height: 16px; border-radius: 3px; border: 1px solid #999; flex-shrink: 0; }
  .pie-popup { text-align: center; font-family: system-ui; min-width: 220px; }
  .pie-popup h3 { font-size: 15px; margin-bottom: 4px; color: #333; }
  .pie-popup .total { font-size: 12px; color: #666; margin-bottom: 8px; }
  .pie-popup canvas { margin: 0 auto; }
  .pie-popup .breakdown { font-size: 11px; text-align: left; margin-top: 8px; }
  .pie-popup .breakdown div { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
  .pie-popup .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .info-tooltip {
    background: white; padding: 6px 10px; border-radius: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3); font-family: system-ui; font-size: 12px;
    border: none;
  }
</style>
</head>
<body>
<div id="map"></div>
<script>
const COLORS = {
  strong_support: '#0B413E',
  medium_support: '#4F9A94',
  neutral: '#C9BFC3',
  medium_oppose: '#CF86A6',
  strong_oppose: '#7B1E4B'
};

const LABELS = {
  strong_support: 'Strong Support',
  medium_support: 'Medium Support',
  neutral: 'Neutral',
  medium_oppose: 'Medium Oppose',
  strong_oppose: 'Strong Oppose'
};

const FILL_COLORS = [
  [0,   'rgba(0,0,0,0)'],
  [1,   'rgba(198,219,239,0.6)'],
  [11,  'rgba(158,202,225,0.6)'],
  [31,  'rgba(107,174,214,0.6)'],
  [61,  'rgba(49,130,189,0.6)'],
  [101, 'rgba(8,81,156,0.6)']
];

function getFillColor(total) {
  let color = FILL_COLORS[0][1];
  for (const [threshold, c] of FILL_COLORS) {
    if (total >= threshold) color = c;
  }
  return color;
}

const map = L.map('map').setView([33.48, -112.05], 12);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  maxZoom: 19
}).addTo(map);

const tooltip = L.tooltip({ sticky: true, className: 'info-tooltip' });

// Load data
Promise.all([
  fetch('precincts.geojson').then(r => r.json()),
  fetch('cd4.geojson').then(r => r.json())
]).then(([precincts, cd4]) => {

  // CD4 boundary
  L.geoJSON(cd4, {
    style: { color: '#FF4500', weight: 2.5, fill: false, dashArray: '8,4' }
  }).addTo(map);

  // Precincts
  const precinctsLayer = L.geoJSON(precincts, {
    style: function(feature) {
      const total = feature.properties.total_responses;
      return {
        fillColor: getFillColor(total),
        fillOpacity: total > 0 ? 0.7 : 0,
        color: total > 0 ? '#1e1e1e' : '#aaa',
        weight: total > 0 ? 1.2 : 0.5
      };
    },
    onEachFeature: function(feature, layer) {
      const p = feature.properties;

      // Tooltip on hover
      layer.on('mouseover', function(e) {
        let tip = `<strong>${p.Precinct_Cap}</strong>`;
        if (p.total_responses > 0) tip += `<br>${p.total_responses} responses`;
        layer.bindTooltip(tip, { sticky: true, className: 'info-tooltip' }).openTooltip(e.latlng);
        layer.setStyle({ weight: 2.5, color: '#333' });
      });
      layer.on('mouseout', function() {
        layer.closeTooltip();
        layer.unbindTooltip();
        precinctsLayer.resetStyle(layer);
      });

      // Popup with pie chart on click
      if (p.total_responses > 0) {
        layer.on('click', function(e) {
          const canvasId = 'pie-' + p.district_id;
          const categories = ['strong_support','medium_support','neutral','medium_oppose','strong_oppose'];
          const values = categories.map(c => p[c]);
          const colors = categories.map(c => COLORS[c]);
          const labels = categories.map(c => LABELS[c]);

          let breakdownHtml = '';
          categories.forEach((c, i) => {
            if (values[i] > 0) {
              const pct = Math.round(values[i] / p.total_responses * 100);
              breakdownHtml += `<div><span class="dot" style="background:${colors[i]}"></span>${labels[i]}: ${values[i]} (${pct}%)</div>`;
            }
          });

          const html = `
            <div class="pie-popup">
              <h3>${p.Precinct_Cap}</h3>
              <div class="total">${p.total_responses} total responses</div>
              <canvas id="${canvasId}" width="160" height="160"></canvas>
              <div class="breakdown">${breakdownHtml}</div>
            </div>
          `;

          const popup = L.popup({ maxWidth: 260 })
            .setLatLng(e.latlng)
            .setContent(html)
            .openOn(map);

          // Render pie chart after popup opens
          setTimeout(() => {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            new Chart(canvas, {
              type: 'pie',
              data: {
                labels: labels,
                datasets: [{
                  data: values,
                  backgroundColor: colors,
                  borderWidth: 1,
                  borderColor: '#fff'
                }]
              },
              options: {
                responsive: false,
                plugins: {
                  legend: { display: false },
                  tooltip: {
                    callbacks: {
                      label: function(ctx) {
                        const pct = Math.round(ctx.raw / p.total_responses * 100);
                        return `${ctx.label}: ${ctx.raw} (${pct}%)`;
                      }
                    }
                  }
                }
              }
            });
          }, 50);
        });
      }
    }
  }).addTo(map);

  // Precinct labels
  precinctsLayer.eachLayer(function(layer) {
    const center = layer.getBounds().getCenter();
    const name = layer.feature.properties.Precinct_Cap;
    L.marker(center, {
      icon: L.divIcon({
        className: 'precinct-label',
        html: `<div style="font-size:9px;font-family:system-ui;color:#333;
                text-shadow:1px 1px 2px white,-1px -1px 2px white,1px -1px 2px white,-1px 1px 2px white;
                white-space:nowrap;pointer-events:none;font-weight:500;text-align:center;
                transform:translate(-50%,-50%)">${name}</div>`,
        iconSize: [0, 0]
      }),
      interactive: false
    }).addTo(map);
  });

  // Fit to CD4 bounds
  map.fitBounds(L.geoJSON(cd4).getBounds().pad(0.05));
});

// Legend
const legend = L.control({ position: 'bottomright' });
legend.onAdd = function() {
  const div = L.DomUtil.create('div', 'legend');
  div.innerHTML = `
    <h4>Ed Hermes Support</h4>
    <div class="legend-item"><span class="legend-color" style="background:#0B413E"></span>Strong Support</div>
    <div class="legend-item"><span class="legend-color" style="background:#4F9A94"></span>Medium Support</div>
    <div class="legend-item"><span class="legend-color" style="background:#C9BFC3"></span>Neutral</div>
    <div class="legend-item"><span class="legend-color" style="background:#CF86A6"></span>Medium Oppose</div>
    <div class="legend-item"><span class="legend-color" style="background:#7B1E4B"></span>Strong Oppose</div>
    <hr style="margin:6px 0;border:none;border-top:1px solid #ddd">
    <h4>Response Count</h4>
    <div class="legend-item"><span class="legend-color" style="background:rgba(198,219,239,0.6)"></span>1-10</div>
    <div class="legend-item"><span class="legend-color" style="background:rgba(158,202,225,0.6)"></span>11-30</div>
    <div class="legend-item"><span class="legend-color" style="background:rgba(107,174,214,0.6)"></span>31-60</div>
    <div class="legend-item"><span class="legend-color" style="background:rgba(49,130,189,0.6)"></span>61-100</div>
    <div class="legend-item"><span class="legend-color" style="background:rgba(8,81,156,0.6)"></span>101-200</div>
  `;
  return div;
};
legend.addTo(map);
</script>
</body>
</html>
