<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ed Hermes Support — Proportional Fill Comparison</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui; }
  .container { display: flex; height: 100vh; }
  .map-wrap { flex: 1; position: relative; border-right: 2px solid #333; }
  .map-wrap:last-child { border-right: none; }
  .map-wrap .label {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    z-index: 1000; background: white; padding: 8px 16px; border-radius: 6px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3); font-weight: bold; font-size: 14px;
    white-space: nowrap;
  }
  #map1, #map2 { width: 100%; height: 100%; }
  .leaflet-interactive:focus { outline: none; }
  .info-tooltip {
    background: white; padding: 6px 10px; border-radius: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3); font-family: system-ui; font-size: 12px;
    border: none;
  }
  .legend {
    background: white; padding: 10px 14px; border-radius: 6px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2); font-size: 12px; line-height: 1.8;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-color { width: 14px; height: 14px; border-radius: 2px; border: 1px solid #999; }
  /* Mobile: stack vertically */
  @media (max-width: 768px) {
    .container { flex-direction: column; }
    .map-wrap { border-right: none; border-bottom: 2px solid #333; }
    .map-wrap:last-child { border-bottom: none; }
    .map-wrap .label { font-size: 12px; padding: 6px 12px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="map-wrap">
    <div class="label">Option 1: Diagonal Gradient</div>
    <div id="map1"></div>
  </div>
  <div class="map-wrap">
    <div class="label">Option 2: Vertical Split Polygons</div>
    <div id="map2"></div>
  </div>
</div>
<script>
const CATEGORIES = ['strong_support','medium_support','neutral','medium_oppose','strong_oppose','voted_for_ed'];
const COLORS = ['#0B413E','#4F9A94','#C9BFC3','#CF86A6','#7B1E4B','#FFD700'];
const LABELS = ['Strong Support','Medium Support','Neutral','Medium Oppose','Strong Oppose','Voted for ED'];

const map1 = L.map('map1').setView([33.48, -112.05], 12);
const map2 = L.map('map2').setView([33.48, -112.05], 12);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OSM', maxZoom: 19
}).addTo(map1);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OSM', maxZoom: 19
}).addTo(map2);

// Sync maps (with guard to prevent recursive firing)
let syncing = false;
map1.on('move', function() {
  if (syncing) return;
  syncing = true;
  map2.setView(map1.getCenter(), map1.getZoom(), {animate: false});
  syncing = false;
});
map2.on('move', function() {
  if (syncing) return;
  syncing = true;
  map1.setView(map2.getCenter(), map2.getZoom(), {animate: false});
  syncing = false;
});

// --- OPTION 1: SVG Diagonal Gradient (hard color stops, no tiling) ---
let gradCounter = 0;

function createDiagonalGradient(defs, proportions) {
  const id = 'grad-' + (gradCounter++);

  const grad = document.createElementNS('http://www.w3.org/2000/svg', 'linearGradient');
  grad.setAttribute('id', id);
  grad.setAttribute('x1', '0');
  grad.setAttribute('y1', '0');
  grad.setAttribute('x2', '1');
  grad.setAttribute('y2', '1');

  let cumPct = 0;
  proportions.forEach(({color, pct}) => {
    if (pct <= 0) return;
    // Hard stop: start of this color
    const stop1 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
    stop1.setAttribute('offset', cumPct.toFixed(2) + '%');
    stop1.setAttribute('stop-color', color);
    grad.appendChild(stop1);

    cumPct += pct;

    // Hard stop: end of this color
    const stop2 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
    stop2.setAttribute('offset', cumPct.toFixed(2) + '%');
    stop2.setAttribute('stop-color', color);
    grad.appendChild(stop2);
  });

  defs.appendChild(grad);
  return id;
}

function buildOption1(geojsonData, map) {
  const renderer = L.svg();
  const geoLayer = L.geoJSON(geojsonData, {
    renderer: renderer,
    style: function(feature) {
      const p = feature.properties;
      if (p.total_responses === 0) {
        return { fillOpacity: 0, color: '#aaa', weight: 0.5 };
      }
      return { color: '#333', weight: 1, fillColor: '#999', fillOpacity: 0.85 };
    },
    onEachFeature: function(feature, layer) {
      const p = feature.properties;
      if (p.total_responses === 0) return;

      const proportions = [];
      CATEGORIES.forEach((cat, i) => {
        const val = p[cat] || 0;
        if (val > 0) {
          proportions.push({ color: COLORS[i], pct: val / p.total_responses * 100 });
        }
      });

      layer._proportions = proportions;

      layer.on('mouseover', function(e) {
        let tip = `<strong>${p.Precinct_Cap}</strong><br>${p.total_responses} responses`;
        proportions.forEach(({color, pct}) => {
          const idx = COLORS.indexOf(color);
          tip += `<br><span style="color:${color}">■</span> ${LABELS[idx]}: ${Math.round(pct)}%`;
        });
        layer.bindTooltip(tip, { sticky: true, className: 'info-tooltip' }).openTooltip(e.latlng);
        layer.setStyle({ weight: 2.5, color: '#000' });
        const el = layer.getElement();
        if (el && el._gradId) {
          el.setAttribute('fill', 'url(#' + el._gradId + ')');
          el.setAttribute('fill-opacity', '0.85');
        }
      });
      layer.on('mouseout', function() {
        layer.closeTooltip();
        layer.unbindTooltip();
        layer.setStyle({ weight: 1, color: '#333' });
        const el = layer.getElement();
        if (el && el._gradId) {
          el.setAttribute('fill', 'url(#' + el._gradId + ')');
          el.setAttribute('fill-opacity', '0.85');
        }
      });
    }
  }).addTo(map);

  function applyGradients() {
    const svgEl = renderer._container;
    if (!svgEl) return;
    let defs = svgEl.querySelector('defs');
    if (!defs) {
      defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
      svgEl.insertBefore(defs, svgEl.firstChild);
    }

    geoLayer.eachLayer(function(layer) {
      if (!layer._proportions) return;
      const el = layer.getElement();
      if (!el) return;
      if (!el._gradId) {
        el._gradId = createDiagonalGradient(defs, layer._proportions);
      }
      el.setAttribute('fill', 'url(#' + el._gradId + ')');
      el.setAttribute('fill-opacity', '0.85');
    });
  }

  setTimeout(applyGradients, 100);
  map.on('zoomend moveend', function() {
    setTimeout(applyGradients, 50);
  });
}

// --- OPTION 2: Vertical Split Polygons (90°) ---
function buildOption2(geojsonData, map) {
  const group = L.layerGroup().addTo(map);

  geojsonData.features.forEach(function(feature) {
    const p = feature.properties;
    if (p.total_responses === 0) {
      L.geoJSON(feature, {
        style: { fillOpacity: 0, color: '#aaa', weight: 0.5 }
      }).addTo(group);
      return;
    }

    const slices = [];
    CATEGORIES.forEach((cat, i) => {
      const val = p[cat] || 0;
      if (val > 0) {
        slices.push({ color: COLORS[i], pct: val / p.total_responses * 100, label: LABELS[i] });
      }
    });

    let cumPct = 0;
    slices.forEach(function(slice) {
      const startPct = cumPct;
      cumPct += slice.pct;
      const endPct = cumPct;

      const polyLayer = L.geoJSON(feature, {
        style: {
          fillColor: slice.color,
          fillOpacity: 0.85,
          color: 'transparent',
          weight: 0
        },
        interactive: false
      });

      polyLayer.eachLayer(function(lyr) {
        lyr.on('add', function() {
          const el = lyr.getElement();
          if (!el) return;
          el.style.clipPath = `inset(0% ${(100 - endPct).toFixed(2)}% 0% ${startPct.toFixed(2)}%)`;
        });
      });

      polyLayer.addTo(group);
    });

    // Outline + interaction
    L.geoJSON(feature, {
      style: { fill: false, color: '#333', weight: 1 },
      onEachFeature: function(feat, layer) {
        layer.on('mouseover', function(e) {
          let tip = `<strong>${p.Precinct_Cap}</strong><br>${p.total_responses} responses`;
          slices.forEach(s => {
            tip += `<br><span style="color:${s.color}">■</span> ${s.label}: ${Math.round(s.pct)}%`;
          });
          layer.bindTooltip(tip, { sticky: true, className: 'info-tooltip' }).openTooltip(e.latlng);
          layer.setStyle({ weight: 2.5, color: '#000' });
        });
        layer.on('mouseout', function() {
          layer.closeTooltip();
          layer.unbindTooltip();
          layer.setStyle({ weight: 1, color: '#333' });
        });
      }
    }).addTo(group);
  });
}

// Legends
function addLegend(map) {
  const legend = L.control({ position: 'bottomright' });
  legend.onAdd = function() {
    const div = L.DomUtil.create('div', 'legend');
    div.innerHTML = '<strong>Ed Hermes Support</strong><br>';
    LABELS.forEach((label, i) => {
      div.innerHTML += `<div class="legend-item"><span class="legend-color" style="background:${COLORS[i]}"></span>${label}</div>`;
    });
    return div;
  };
  legend.addTo(map);
}

// Load data
const cb = '?v=' + Date.now();
Promise.all([
  fetch('precincts.geojson' + cb).then(r => r.json()),
  fetch('cd4.geojson' + cb).then(r => r.json())
]).then(([precincts, cd4]) => {
  L.geoJSON(cd4, { style: { color: '#FF4500', weight: 2.5, fill: false, dashArray: '8,4' } }).addTo(map1);
  L.geoJSON(cd4, { style: { color: '#FF4500', weight: 2.5, fill: false, dashArray: '8,4' } }).addTo(map2);

  buildOption1(precincts, map1);
  buildOption2(precincts, map2);

  addLegend(map1);
  addLegend(map2);

  map1.fitBounds(L.geoJSON(cd4).getBounds().pad(0.05));
  map2.fitBounds(L.geoJSON(cd4).getBounds().pad(0.05));
});
</script>
</body>
</html>
