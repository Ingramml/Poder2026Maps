<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ed Hermes Support — Proportional Fill Comparison</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui; }
  .container { display: flex; height: 100vh; }
  .map-wrap { flex: 1; position: relative; border-right: 2px solid #333; }
  .map-wrap:last-child { border-right: none; }
  .map-wrap .label {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    z-index: 1000; background: white; padding: 8px 16px; border-radius: 6px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3); font-weight: bold; font-size: 14px;
    white-space: nowrap;
  }
  #map1, #map2 { width: 100%; height: 100%; }
  .leaflet-interactive:focus { outline: none; }
  .info-tooltip {
    background: white; padding: 6px 10px; border-radius: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3); font-family: system-ui; font-size: 12px;
    border: none;
  }
  .legend {
    background: white; padding: 10px 14px; border-radius: 6px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2); font-size: 12px; line-height: 1.8;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-color { width: 14px; height: 14px; border-radius: 2px; border: 1px solid #999; }
</style>
</head>
<body>
<div class="container">
  <div class="map-wrap">
    <div class="label">Option 1: SVG Gradient Pattern</div>
    <div id="map1"></div>
  </div>
  <div class="map-wrap">
    <div class="label">Option 2: Stacked Clipped Polygons</div>
    <div id="map2"></div>
  </div>
</div>
<script>
const CATEGORIES = ['strong_support','medium_support','neutral','medium_oppose','strong_oppose','voted_for_ed'];
const COLORS = ['#0B413E','#4F9A94','#C9BFC3','#CF86A6','#7B1E4B','#FFD700'];
const LABELS = ['Strong Support','Medium Support','Neutral','Medium Oppose','Strong Oppose','Voted for ED'];

const map1 = L.map('map1').setView([33.48, -112.05], 12);
const map2 = L.map('map2').setView([33.48, -112.05], 12);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OSM', maxZoom: 19
}).addTo(map1);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OSM', maxZoom: 19
}).addTo(map2);

// Sync maps
map1.on('move', function() { map2.setView(map1.getCenter(), map1.getZoom(), {animate: false}); });
map2.on('move', function() { map1.setView(map2.getCenter(), map2.getZoom(), {animate: false}); });

// --- OPTION 1: SVG Gradient Patterns ---
let patternCounter = 0;

function ensureDefs(map) {
  const svg = map.getRenderer(L.geoJSON())._container || map.getPane('overlayPane').querySelector('svg');
  if (!svg) return null;
  let defs = svg.querySelector('defs');
  if (!defs) {
    defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
    svg.insertBefore(defs, svg.firstChild);
  }
  return defs;
}

function createSVGPattern(defs, proportions) {
  const id = 'pat-' + (patternCounter++);
  const size = 40;

  const pattern = document.createElementNS('http://www.w3.org/2000/svg', 'pattern');
  pattern.setAttribute('id', id);
  pattern.setAttribute('patternUnits', 'userSpaceOnUse');
  pattern.setAttribute('width', size);
  pattern.setAttribute('height', size);
  pattern.setAttribute('patternTransform', 'rotate(45)');

  let cumY = 0;
  proportions.forEach(({color, pct}) => {
    if (pct <= 0) return;
    const h = pct / 100 * size;
    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    rect.setAttribute('x', '0');
    rect.setAttribute('y', cumY.toString());
    rect.setAttribute('width', size.toString());
    rect.setAttribute('height', h.toString());
    rect.setAttribute('fill', color);
    pattern.appendChild(rect);
    cumY += h;
  });

  defs.appendChild(pattern);
  return id;
}

function buildOption1(geojsonData, map) {
  // Use SVG renderer explicitly
  const renderer = L.svg();
  const geoLayer = L.geoJSON(geojsonData, {
    renderer: renderer,
    style: function(feature) {
      const p = feature.properties;
      if (p.total_responses === 0) {
        return { fillOpacity: 0, color: '#aaa', weight: 0.5 };
      }
      return { color: '#333', weight: 1, fillColor: '#999', fillOpacity: 0.85 };
    },
    onEachFeature: function(feature, layer) {
      const p = feature.properties;
      if (p.total_responses === 0) return;

      const proportions = [];
      CATEGORIES.forEach((cat, i) => {
        const val = p[cat] || 0;
        if (val > 0) {
          proportions.push({ color: COLORS[i], pct: val / p.total_responses * 100 });
        }
      });

      layer._proportions = proportions;

      layer.on('mouseover', function(e) {
        let tip = `<strong>${p.Precinct_Cap}</strong><br>${p.total_responses} responses`;
        proportions.forEach(({color, pct}) => {
          const idx = COLORS.indexOf(color);
          tip += `<br><span style="color:${color}">■</span> ${LABELS[idx]}: ${Math.round(pct)}%`;
        });
        layer.bindTooltip(tip, { sticky: true, className: 'info-tooltip' }).openTooltip(e.latlng);
        layer.setStyle({ weight: 2.5, color: '#000' });
        // Re-apply pattern fill after setStyle
        const el = layer.getElement();
        if (el && el._patternId) {
          el.setAttribute('fill', 'url(#' + el._patternId + ')');
          el.setAttribute('fill-opacity', '0.85');
        }
      });
      layer.on('mouseout', function() {
        layer.closeTooltip();
        layer.unbindTooltip();
        layer.setStyle({ weight: 1, color: '#333' });
        const el = layer.getElement();
        if (el && el._patternId) {
          el.setAttribute('fill', 'url(#' + el._patternId + ')');
          el.setAttribute('fill-opacity', '0.85');
        }
      });
    }
  }).addTo(map);

  // After layer is on the map, inject patterns into the SVG
  setTimeout(function() {
    const svgEl = renderer._container;
    let defs = svgEl.querySelector('defs');
    if (!defs) {
      defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
      svgEl.insertBefore(defs, svgEl.firstChild);
    }

    geoLayer.eachLayer(function(layer) {
      if (!layer._proportions) return;
      const patId = createSVGPattern(defs, layer._proportions);
      const el = layer.getElement();
      if (el) {
        el.setAttribute('fill', 'url(#' + patId + ')');
        el.setAttribute('fill-opacity', '0.85');
        el._patternId = patId;
      }
    });
  }, 100);
}

// --- OPTION 2: Stacked Clipped Polygons ---
function buildOption2(geojsonData, map) {
  const group = L.layerGroup().addTo(map);

  geojsonData.features.forEach(function(feature) {
    const p = feature.properties;
    if (p.total_responses === 0) {
      L.geoJSON(feature, {
        style: { fillOpacity: 0, color: '#aaa', weight: 0.5 }
      }).addTo(group);
      return;
    }

    // Calculate proportions
    const slices = [];
    CATEGORIES.forEach((cat, i) => {
      const val = p[cat] || 0;
      if (val > 0) {
        slices.push({ color: COLORS[i], pct: val / p.total_responses * 100, label: LABELS[i] });
      }
    });

    // Get bounding box for clip calculations
    const coords = feature.geometry.type === 'MultiPolygon'
      ? feature.geometry.coordinates[0][0]
      : feature.geometry.coordinates[0];
    const lats = coords.map(c => c[1]);
    const lons = coords.map(c => c[0]);
    const minLat = Math.min(...lats), maxLat = Math.max(...lats);
    const minLon = Math.min(...lons), maxLon = Math.max(...lons);
    const dLat = maxLat - minLat;
    const dLon = maxLon - minLon;
    // Diagonal length for 45° sweep
    const diagLen = dLat + dLon;

    let cumPct = 0;
    slices.forEach(function(slice, idx) {
      const startFrac = cumPct / 100;
      cumPct += slice.pct;
      const endFrac = cumPct / 100;

      // Create a clip polygon: 45° band across the bounding box
      // The band sweeps from bottom-left to top-right
      const pad = 0.01; // padding
      const s0 = startFrac * diagLen;
      const s1 = endFrac * diagLen;

      // Build clip polygon as intersection with the 45° band
      // Band defined by: (lon - minLon) + (maxLat - lat) >= s0*diagLen
      //                   (lon - minLon) + (maxLat - lat) <= s1*diagLen
      // We create a large polygon for the band and rely on Leaflet to clip visually

      const clipCoords = [];
      const steps = 50;

      // Bottom edge of band (s0 line)
      // Top edge of band (s1 line)
      // 45° line: lon = minLon + s - (maxLat - lat), i.e. for each lat, lon at the cut

      // Create band polygon
      const bigPad = Math.max(dLat, dLon) * 2;

      // s0 line points (going right)
      const s0_bl_lon = minLon - pad + s0 - 0;
      const s0_bl_lat = maxLat + pad;
      const s0_tr_lon = minLon - pad + s0 + bigPad;
      const s0_tr_lat = maxLat + pad - bigPad;

      // s1 line points (going right)
      const s1_bl_lon = minLon - pad + s1 - 0;
      const s1_bl_lat = maxLat + pad;
      const s1_tr_lon = minLon - pad + s1 + bigPad;
      const s1_tr_lat = maxLat + pad - bigPad;

      // Band polygon (between s0 and s1 lines)
      const bandPoly = [
        [s0_bl_lat, s0_bl_lon],
        [s0_tr_lat, s0_tr_lon],
        [s1_tr_lat, s1_tr_lon],
        [s1_bl_lat, s1_bl_lon]
      ];

      // Use turf-like intersection: create the polygon layer with the band as a mask
      // Actually, we'll use a simpler approach: multiple polygon copies with CSS clip-path

      // For each slice, add the full precinct polygon with the slice color
      const polyLayer = L.geoJSON(feature, {
        style: {
          fillColor: slice.color,
          fillOpacity: 0.85,
          color: idx === slices.length - 1 ? '#333' : 'transparent',
          weight: idx === slices.length - 1 ? 1 : 0
        },
        interactive: idx === slices.length - 1 // only top layer interactive
      });

      polyLayer.eachLayer(function(lyr) {
        lyr.on('add', function() {
          const el = lyr.getElement();
          if (!el) return;

          // Apply CSS clip-path using polygon()
          // 45° diagonal clips: we use inset or polygon
          // Map percentage to a diagonal sweep from top-left to bottom-right
          // clip-path: polygon() with 45° angle cuts

          const s = startFrac * 100;
          const e = endFrac * 100;

          // For 45° diagonal, we shift the clip by percentage
          // Think of it as a parallelogram sweeping across
          let clipPath;
          if (idx === 0 && slices.length === 1) {
            clipPath = 'none'; // full polygon
          } else {
            // Create diagonal clip
            // The idea: at 0% we're at top-left corner, at 100% bottom-right
            // Each cut line goes from (s%, 0) to (0, s%) effectively
            const pts = [];

            if (s <= 0) {
              pts.push('0% 0%');
            } else {
              if (s <= 50) {
                pts.push(`0% ${s * 2}%`);
                pts.push(`${s * 2}% 0%`);
              } else {
                pts.push(`${(s - 50) * 2}% 100%`);
                pts.push(`100% ${(s - 50) * 2}%`);
              }
            }

            if (e >= 100) {
              pts.push('100% 0%');
              pts.push('100% 100%');
              pts.push('0% 100%');
            } else {
              if (e <= 50) {
                pts.push(`${e * 2}% 0%`);
                pts.push('0% 0%');
              } else {
                pts.push('100% ' + ((e - 50) * 2) + '%');
                pts.push('100% 100%');
                pts.push(((e - 50) * 2) + '% 100%');
              }
            }

            // Close back
            if (s <= 0) {
              // already at 0% 0%
            }

            clipPath = `polygon(${pts.join(', ')})`;
          }

          if (clipPath !== 'none') {
            el.style.clipPath = clipPath;
          }
        });
      });

      polyLayer.addTo(group);
    });

    // Add outline on top
    L.geoJSON(feature, {
      style: { fill: false, color: '#333', weight: 1 },
      onEachFeature: function(feat, layer) {
        layer.on('mouseover', function(e) {
          let tip = `<strong>${p.Precinct_Cap}</strong><br>${p.total_responses} responses`;
          slices.forEach(s => {
            tip += `<br><span style="color:${s.color}">■</span> ${s.label}: ${Math.round(s.pct)}%`;
          });
          layer.bindTooltip(tip, { sticky: true, className: 'info-tooltip' }).openTooltip(e.latlng);
          layer.setStyle({ weight: 2.5, color: '#000' });
        });
        layer.on('mouseout', function() {
          layer.closeTooltip();
          layer.unbindTooltip();
          layer.setStyle({ weight: 1, color: '#333' });
        });
      }
    }).addTo(group);
  });
}

// Add legends
function addLegend(map) {
  const legend = L.control({ position: 'bottomright' });
  legend.onAdd = function() {
    const div = L.DomUtil.create('div', 'legend');
    div.innerHTML = '<strong>Ed Hermes Support</strong><br>';
    LABELS.forEach((label, i) => {
      div.innerHTML += `<div class="legend-item"><span class="legend-color" style="background:${COLORS[i]}"></span>${label}</div>`;
    });
    return div;
  };
  legend.addTo(map);
}

// Load data
const cb = '?v=' + Date.now();
Promise.all([
  fetch('precincts.geojson' + cb).then(r => r.json()),
  fetch('cd4.geojson' + cb).then(r => r.json())
]).then(([precincts, cd4]) => {
  // CD4 boundary on both maps
  L.geoJSON(cd4, { style: { color: '#FF4500', weight: 2.5, fill: false, dashArray: '8,4' } }).addTo(map1);
  L.geoJSON(cd4, { style: { color: '#FF4500', weight: 2.5, fill: false, dashArray: '8,4' } }).addTo(map2);

  buildOption1(precincts, map1);
  buildOption2(precincts, map2);

  addLegend(map1);
  addLegend(map2);

  map1.fitBounds(L.geoJSON(cd4).getBounds().pad(0.05));
  map2.fitBounds(L.geoJSON(cd4).getBounds().pad(0.05));
});
</script>
</body>
</html>
