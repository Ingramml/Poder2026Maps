<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phoenix Dist 4 - Election Results</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  #map { width: 100%; height: 100vh; }
  .legend {
    background: white; padding: 12px 16px; border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2); line-height: 1.8; font-family: system-ui;
    max-width: 220px;
  }
  .legend h4 { margin-bottom: 6px; font-size: 13px; }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .legend-color { width: 16px; height: 16px; border-radius: 3px; border: 1px solid #999; flex-shrink: 0; }
  .map-title {
    background: white; padding: 10px 20px; border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2); font-family: system-ui;
    font-size: 16px; font-weight: bold; color: #333;
  }
  .map-title .subtitle { font-size: 11px; font-weight: normal; color: #888; }
  .info-tooltip {
    background: white; padding: 6px 10px; border-radius: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3); font-family: system-ui; font-size: 12px;
    border: none;
  }
  .results-popup { font-family: system-ui; min-width: 280px; }
  .results-popup h3 { font-size: 15px; margin-bottom: 2px; color: #333; }
  .results-popup .summary { font-size: 12px; color: #666; margin-bottom: 8px; }
  .results-popup table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .results-popup th { text-align: left; padding: 4px 6px; border-bottom: 2px solid #333; font-size: 11px; color: #666; }
  .results-popup td { padding: 4px 6px; border-bottom: 1px solid #eee; }
  .results-popup tr.winner td { font-weight: 600; background: #e8f5e9; }
  .results-popup .bar-cell { width: 80px; }
  .results-popup .bar { height: 12px; border-radius: 2px; }
  .results-popup .pct { text-align: right; color: #555; }
  .results-popup .votes { text-align: right; }
  .nav-link {
    background: white; padding: 8px 14px; border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2); font-family: system-ui; font-size: 12px;
  }
  .nav-link a { color: #1565C0; text-decoration: none; }
  .nav-link a:hover { text-decoration: underline; }
  .search-control {
    background: white; padding: 6px; border-radius: 6px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2); font-family: system-ui;
  }
  .search-control input {
    border: 1px solid #ccc; border-radius: 4px; padding: 4px 8px;
    font-size: 12px; width: 160px; outline: none;
  }
  .search-control input:focus { border-color: #666; }
  .search-results { max-height: 150px; overflow-y: auto; margin-top: 4px; }
  .search-results div { padding: 3px 8px; font-size: 12px; cursor: pointer; border-radius: 3px; }
  .search-results div:hover { background: #eee; }
  .precinct-label {
    font-family: system-ui; font-size: 10px; font-weight: 600;
    color: #222; white-space: nowrap; text-align: center;
    text-shadow: 1px 1px 2px white, -1px -1px 2px white, 1px -1px 2px white, -1px 1px 2px white;
  }
</style>
</head>
<body>
<div id="map"></div>
<script>
const MARGIN_COLORS = [
  { min: -Infinity, max: 0,  color: '#d73027', label: 'Loss' },
  { min: 0,  max: 5,  color: '#91bfdb', label: '0 - 5 pts' },
  { min: 5,  max: 15, color: '#4393c3', label: '5 - 15 pts' },
  { min: 15, max: 30, color: '#2166ac', label: '15 - 30 pts' },
  { min: 30, max: Infinity, color: '#053061', label: '30+ pts' }
];

const CANDIDATE_COLORS = {
  'HERMES, ED': '#2166ac',
  'HARDER, ASHLEY': '#e6550d',
  'JIMENEZ, PATRICIA': '#31a354',
  'HERNANDEZ, CASSANDRA': '#756bb1',
  'SCHMITZ, MEGAN': '#e7298a',
  'MAZZOCCO, MICHAEL': '#66c2a5',
  'LAUER, ZACHARY': '#fc8d62',
  'OLIVIERI, ROBB': '#8da0cb',
  'Write-in': '#999999'
};

const VOTES_COLORS = [
  { min: 0,   max: 150,  color: '#c6dbef', label: '0 - 150' },
  { min: 150, max: 300,  color: '#9ecae1', label: '150 - 300' },
  { min: 300, max: 500,  color: '#6baed6', label: '300 - 500' },
  { min: 500, max: 800,  color: '#3182bd', label: '500 - 800' },
  { min: 800, max: Infinity, color: '#08306b', label: '800+' }
];

function getMarginColor(margin) {
  for (const c of MARGIN_COLORS) {
    if (margin >= c.min && margin < c.max) return c.color;
  }
  return '#053061';
}

function getVotesColor(votes) {
  for (const c of VOTES_COLORS) {
    if (votes >= c.min && votes < c.max) return c.color;
  }
  return '#08306b';
}

const map = L.map('map').setView([33.49, -112.09], 12);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap', maxZoom: 19
}).addTo(map);

// Title
const titleCtrl = L.control({ position: 'topleft' });
titleCtrl.onAdd = function() {
  const div = L.DomUtil.create('div', 'map-title');
  div.innerHTML = 'Phoenix Dist 4 - Councilmember<br><span class="subtitle">Nov 2026 Election Results | Pct Margin: Ed Hermes vs Runner-up</span>';
  return div;
};
titleCtrl.addTo(map);

// Nav link back to main map
const navCtrl = L.control({ position: 'topleft' });
navCtrl.onAdd = function() {
  const div = L.DomUtil.create('div', 'nav-link');
  div.innerHTML = '<a href="index.html">&larr; Back to Survey Map</a>';
  return div;
};
navCtrl.addTo(map);

// Legend (updates when layer changes)
const legendCtrl = L.control({ position: 'bottomright' });
legendCtrl.onAdd = function() {
  this._div = L.DomUtil.create('div', 'legend');
  this.updateMargin();
  return this._div;
};
legendCtrl.updateMargin = function() {
  this._div.innerHTML = '<h4>Ed Hermes Pct Margin</h4>';
  for (const c of MARGIN_COLORS) {
    this._div.innerHTML += `<div class="legend-item"><span class="legend-color" style="background:${c.color}"></span>${c.label}</div>`;
  }
};
legendCtrl.updateVotes = function() {
  this._div.innerHTML = '<h4>Hermes Votes</h4>';
  for (const c of VOTES_COLORS) {
    this._div.innerHTML += `<div class="legend-item"><span class="legend-color" style="background:${c.color}"></span>${c.label}</div>`;
  }
};
legendCtrl.addTo(map);

// Search
const searchCtrl = L.control({ position: 'topright' });
searchCtrl.onAdd = function() {
  const div = L.DomUtil.create('div', 'search-control');
  div.innerHTML = '<input type="text" placeholder="Search precinct..." id="search-input"><div class="search-results" id="search-results"></div>';
  L.DomEvent.disableClickPropagation(div);
  return div;
};
searchCtrl.addTo(map);

// Tooltip
const info = L.control({ position: 'topright' });
info.onAdd = function() {
  this._div = L.DomUtil.create('div', 'info-tooltip');
  this._div.style.display = 'none';
  return this._div;
};
info.update = function(props) {
  if (!props) { this._div.style.display = 'none'; return; }
  this._div.style.display = 'block';
  this._div.innerHTML = `<b>${props.Precinct_Cap}</b><br>Margin: ${props.pct_margin > 0 ? '+' : ''}${props.pct_margin} pts | ${props.total_votes} votes cast`;
};
info.addTo(map);

let precinctLayers = [];

function buildVotesPopup(props) {
  const hermes = props.candidates.find(c => c.candidate === 'HERMES, ED') || {};
  return `<div class="results-popup">
    <h3>${props.Precinct_Cap}</h3>
    <table>
      <tr><th colspan="2">Hermes Performance</th></tr>
      <tr><td>Hermes Votes</td><td class="votes"><b>${(props.hermes_votes || 0).toLocaleString()}</b></td></tr>
      <tr><td>Hermes %</td><td class="votes">${props.hermes_pct}%</td></tr>
      <tr><td>Total Votes Cast</td><td class="votes">${props.total_votes.toLocaleString()}</td></tr>
      <tr><td>Margin over 2nd</td><td class="votes">${props.margin > 0 ? '+' : ''}${props.margin.toLocaleString()}</td></tr>
      <tr><td>Runner-up</td><td class="votes">${props.runner_up} (${(props.runner_up_votes || 0).toLocaleString()})</td></tr>
      <tr><th colspan="2" style="padding-top:8px">Turnout</th></tr>
      <tr><td>Registered</td><td class="votes">${(props.registered || 0).toLocaleString()}</td></tr>
      <tr><td>Turnout %</td><td class="votes">${props.turnout_pct}%</td></tr>
      <tr><td>Stayed Home</td><td class="votes">${(props.stayed_home || 0).toLocaleString()}</td></tr>
      <tr><td>Hermes % of Registered</td><td class="votes">${props.hermes_pct_of_registered}%</td></tr>
      ${props.contact_attempts ? `<tr><th colspan="2" style="padding-top:8px">Poder Activity</th></tr><tr><td>Contact Attempts</td><td class="votes">${props.contact_attempts.toLocaleString()}</td></tr>` : ''}
    </table>
  </div>`;
}

function buildPopup(props) {
  const cands = props.candidates;
  let rows = '';
  cands.forEach((c, i) => {
    const isWinner = i === 0;
    const barWidth = Math.max(2, (c.pct / cands[0].pct) * 80);
    const color = CANDIDATE_COLORS[c.candidate] || '#999';
    rows += `<tr class="${isWinner ? 'winner' : ''}">
      <td>${c.candidate}${isWinner ? ' &#x2713;' : ''}</td>
      <td class="votes">${c.votes.toLocaleString()}</td>
      <td class="pct">${c.pct}%</td>
      <td class="bar-cell"><div class="bar" style="width:${barWidth}px;background:${color}"></div></td>
    </tr>`;
  });

  return `<div class="results-popup">
    <h3>${props.Precinct_Cap}</h3>
    <div class="summary">Total votes cast: <b>${props.total_votes.toLocaleString()}</b> | Margin: <b>${props.pct_margin > 0 ? '+' : ''}${props.pct_margin} pts</b> (${props.margin > 0 ? '+' : ''}${props.margin.toLocaleString()} votes)</div>
    <table>
      <tr><th>Candidate</th><th style="text-align:right">Votes</th><th style="text-align:right">%</th><th></th></tr>
      ${rows}
    </table>
  </div>`;
}

function buildElectionLayer(data, styleFn, popupFn, tooltipFn) {
  return L.geoJSON(data, {
    style: styleFn,
    onEachFeature: function(feature, layer) {
      layer.bindPopup(popupFn(feature.properties), { maxWidth: 400 });
      layer.on('mouseover', function() {
        tooltipFn(feature.properties);
        this.setStyle({ weight: 3, color: '#000' });
      });
      layer.on('mouseout', function() {
        info.update(null);
        this.setStyle(styleFn(feature));
      });
      precinctLayers.push({ name: feature.properties.Precinct_Cap, layer: layer });
    }
  });
}

const labelsGroup = L.layerGroup();

fetch('election_results.geojson')
  .then(r => r.json())
  .then(data => {
    // Pct Margin layer
    const marginLayer = buildElectionLayer(data,
      f => ({ fillColor: getMarginColor(f.properties.pct_margin), fillOpacity: 0.75, color: '#333', weight: 1.5 }),
      props => buildPopup(props),
      props => info.update(props)
    );

    // Hermes Votes layer
    const votesLayer = buildElectionLayer(data,
      f => ({ fillColor: getVotesColor(f.properties.hermes_votes), fillOpacity: 0.75, color: '#333', weight: 1.5 }),
      props => buildVotesPopup(props),
      props => {
        info._div.style.display = 'block';
        info._div.innerHTML = `<b>${props.Precinct_Cap}</b><br>Hermes: ${(props.hermes_votes||0).toLocaleString()} votes (${props.hermes_pct}%)`;
      }
    );

    // Precinct labels
    data.features.forEach(f => {
      const coords = L.geoJSON(f).getBounds().getCenter();
      labelsGroup.addLayer(L.marker(coords, {
        icon: L.divIcon({ className: 'precinct-label', html: f.properties.Precinct_Cap, iconSize: [0, 0] }),
        interactive: false
      }));
    });
    labelsGroup.addTo(map);

    // Osborn School District overlay
    const osbornPromise = fetch('maricopa_elem_districts.geojson')
      .then(r => r.ok ? r.json() : null)
      .then(gj => {
        if (!gj) return null;
        const osborn = { type: 'FeatureCollection', features: gj.features.filter(f => f.properties.elemdist === 'OSBORN #8') };
        if (!osborn.features.length) return null;
        return L.geoJSON(osborn, {
          style: { fillColor: 'transparent', fillOpacity: 0, color: '#e6550d', weight: 3, dashArray: '8,4' },
          interactive: false
        });
      });

    // Poder Activity points overlay
    const poderPromise = fetch('poder_contacts.geojson')
      .then(r => r.ok ? r.json() : null)
      .then(gj => {
        if (!gj) return null;
        return L.geoJSON(gj, {
          pointToLayer: function(feature, latlng) {
            const ca = feature.properties.contact_attempts;
            let radius;
            if (ca >= 10000) radius = 24;
            else if (ca >= 7000) radius = 19;
            else if (ca >= 5000) radius = 14;
            else if (ca >= 3000) radius = 10;
            else if (ca >= 1000) radius = 7;
            else radius = 4;
            return L.circleMarker(latlng, {
              radius: radius,
              fillColor: '#ff6600',
              color: '#cc4400',
              weight: 1,
              fillOpacity: 0.7
            });
          },
          onEachFeature: function(feature, layer) {
            layer.bindPopup(`<div class="results-popup"><h3>${feature.properties.Precinct_Cap}</h3><div class="summary">Poder Contact Attempts: <b>${feature.properties.contact_attempts.toLocaleString()}</b></div></div>`);
          }
        });
      });

    // Add default layer and controls
    marginLayer.addTo(map);
    map.fitBounds(marginLayer.getBounds(), { padding: [20, 20] });

    const baseLayers = {
      'Pct Margin (1st vs 2nd)': marginLayer,
      'Hermes Dist4 Votes': votesLayer
    };

    Promise.all([osbornPromise, poderPromise]).then(([ol, pl]) => {
      const overlays = { 'Precinct Labels': labelsGroup };
      if (pl) {
        pl.addTo(map);
        overlays['Poder Activity'] = pl;
      }
      if (ol) {
        ol.addTo(map);
        overlays['Osborn School District'] = ol;
      }
      L.control.layers(baseLayers, overlays, { collapsed: false }).addTo(map);
    });

    // Update legend when layer changes
    map.on('baselayerchange', function(e) {
      if (e.name === 'Hermes Dist4 Votes') {
        legendCtrl.updateVotes();
      } else {
        legendCtrl.updateMargin();
      }
    });

    // Search
    const input = document.getElementById('search-input');
    const results = document.getElementById('search-results');
    input.addEventListener('input', function() {
      const q = this.value.toUpperCase();
      results.innerHTML = '';
      if (q.length < 2) return;
      precinctLayers
        .filter(p => p.name.includes(q))
        .slice(0, 8)
        .forEach(p => {
          const d = document.createElement('div');
          d.textContent = p.name;
          d.onclick = function() {
            map.fitBounds(p.layer.getBounds(), { padding: [50, 50], maxZoom: 14 });
            p.layer.openPopup();
            results.innerHTML = '';
            input.value = '';
          };
          results.appendChild(d);
        });
    });
  });
</script>
</body>
</html>
